[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Automated stream/VOD to YouTube Shorts pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python-headless>=4.8,<5",
  "faster-whisper>=1.1",
  "yt-dlp",
]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools]
packages = ["clipforge"]
