[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.2.0"
description = "Automated stream/VOD to YouTube Shorts pipeline"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp",
  "faster-whisper>=1.1",
  "numpy",
  "scenedetect[opencv-headless]>=0.6",
  "opencv-python-headless>=4.8,<5",
  "mediapipe",
  "pyyaml",
  "typer>=0.9",
  "rich",
  "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clipforge = "clipforge.cli:app"

[tool.setuptools]
packages = ["clipforge"]

[tool.setuptools.package-data]
clipforge = ["assets/fonts/*"]
